<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Terraplus | Rebuild the Soil Ecosystem.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              tp: {
                dark:    '#0d2818',
                darker:  '#081a0f',
                green:   '#166534',
                mid:     '#15803d',
                lime:    '#4ade80',
                'lime-lt': '#86efac',
                light:   '#f0fdf4',
                sand:    '#fafaf9',
                amber:   '#d97706',
                gray:    '#f3f4f6',
              }
            },
            fontFamily: {
              serif: ['Playfair Display', 'Georgia', 'serif'],
              sans:  ['Inter', 'system-ui', 'sans-serif'],
            },
            animation: {
              'fade-up': 'fadeUp 0.7s ease forwards',
              'fade-in': 'fadeIn 0.5s ease forwards',
              'count':   'count 2s ease-out forwards',
            },
            keyframes: {
              fadeUp:  { '0%': { opacity: 0, transform: 'translateY(32px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
              fadeIn:  { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
      html { scroll-behavior: smooth; }
      body { font-family: 'Inter', sans-serif; }

      /* Hero */
      .hero-bg {
        background-image: linear-gradient(to bottom, rgba(8,26,15,0.65) 0%, rgba(13,40,24,0.55) 60%, rgba(8,26,15,0.80) 100%), url('/hero-home.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }

      /* Section bgs */
      .philosophy-bg {
        background-image: linear-gradient(to right, rgba(8,26,15,0.88) 0%, rgba(8,26,15,0.60) 100%), url('/hero-philosophy.jpg');
        background-size: cover;
        background-position: center;
      }
      .eco-bg {
        background-image: linear-gradient(to right, rgba(22,101,52,0.92) 0%, rgba(21,128,61,0.75) 100%), url('/hero-contact.jpg');
        background-size: cover;
        background-position: center;
      }

      /* Nav link hover */
      .nav-link { position: relative; }
      .nav-link::after {
        content: '';
        position: absolute;
        bottom: -2px; left: 0;
        width: 0; height: 2px;
        background: #4ade80;
        transition: width 0.25s ease;
      }
      .nav-link:hover::after { width: 100%; }

      /* Card hover glow */
      .card-glow:hover {
        border-color: #4ade80 !important;
        box-shadow: 0 0 20px rgba(74,222,128,0.15);
        transform: translateY(-3px);
        transition: all 0.25s ease;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #081a0f; }
      ::-webkit-scrollbar-thumb { background: #166534; border-radius: 3px; }

      /* Section reveal */
      .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
      .reveal.visible { opacity: 1; transform: translateY(0); }
    </style>
  </head>
  <body class="bg-white text-gray-800">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
